name: Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/ariumsh/aegis/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable the tickets module
        2. Press Remind, then Claim
        3. The countdown message is replaced
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      description: Prefix and slash commands take different code paths, so this matters.
      options:
        - Slash command
        - Prefix command
        - Button or select menu
        - Background worker
        - Not a command
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From `logs/errors.log` or the console. Redact tokens and IDs you would rather not publish.
      render: shell
