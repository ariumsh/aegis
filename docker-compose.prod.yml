version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: aegis-postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: aegis-redis
    restart: always

  bot:
    build: .
    container_name: aegis-bot
    restart: always
    env_file: .env.prod
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
